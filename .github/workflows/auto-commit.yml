name: Проверенные изменения по расписанию

on:
  schedule:
    # Ежечасная проверка плана с 09:07 до 22:07 по Москве (UTC+3).
    # Публикуются только выбранные случайным дневным планом 1–4 шага.
    - cron: '7 6-19 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Только проверить следующий шаг, без публикации
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ghostcommit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости проекта
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: python -m pip install -r requirements.txt
      - name: Проверить и опубликовать очередное изменение
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHECK_ONLY: ${{ inputs.check_only }}
          EVENT_NAME: ${{ github.event_name }}
          PYTHONUTF8: '1'
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            python scripts/publish_prepared.py --check-only
          elif [ "$EVENT_NAME" = "schedule" ]; then
            python scripts/publish_prepared.py --scheduled
          else
            python scripts/publish_prepared.py
          fi
