name: Проверка проекта и очереди
on:
  push:
    branches: [main, prepared-improvements]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: python -m pip install -r requirements.txt
      - name: Тесты проекта
        run: python -m unittest discover -s tests -q
      - name: Проверка защиты очереди
        if: ${{ hashFiles('.ghostcommit/test_queue_worker.py') != '' }}
        run: python -m unittest discover -s .ghostcommit -p test_queue_worker.py -q
